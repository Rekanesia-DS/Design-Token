name: Main to GCS Deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build, Push Artifacts, and Deploy to GCS
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Node.js environment
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run build script
      - name: Run build
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      # Push build artifacts to master
      - name: Push Artifacts to Master
        env:
          PAT: ${{ secrets.ACCESS_TOKEN }}
        run: |
          echo "Pushing build artifacts to master..."
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/
          git commit -m "Add build artifacts from workflow (SHA: ${{ github.sha }})" || echo "No changes to commit."
          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
          git push origin HEAD:master || echo "Failed to push artifacts."

      # Setup Google Cloud CLI
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_email: ${{ secrets.GCP_SA_EMAIL }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: durable-fact-310601

      # Upload build artifacts to GCS
      - name: Upload to GCS
        run: |
          echo "Removing old files from GCS bucket..."
          gsutil -m rm -rf gs://cdn-test-rekan/ui-rekan-ipubers/* || echo "No files to remove."
          echo "Uploading new build artifacts..."
          gsutil -m cp -r build/* gs://cdn-test-rekan/ui-rekan-ipubers
