name: Build Tokens

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.6.1
        uses: actions/setup-node@v3
        with:
          node-version: '20.6.1'

      - name: Cache npm dependencies (optional)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run build (with error handling and logging)
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifacts
          path: build/  # Pastikan folder ini adalah output dari build script Anda

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: my-artifacts
          path: ./build  # Pastikan folder tujuan sama dengan yang diupload sebelumnya

      - name: Create or Switch to master branch
        run: |
          git fetch origin
          git checkout master || git checkout -b master

      - name: Move Artifacts to Root
        run: |
          mv build/* .  # Pindahkan semua file dari folder build ke root

      - name: Commit and Push changes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add moved files to staging area
          git add . || { echo "Failed adding files to staging area."; exit 1; }
        
          # Check if there are any changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            # Commit changes
            git commit -m "Moved build artifacts from workflow (SHA: ${{ github.sha }})" || { echo "Failed committing changes."; exit 1; }
            
            # Set up remote URL with token authentication
            git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
        
            # Push changes
            git push origin master || { echo "Failed pushing changes."; exit 1; }
          fi
