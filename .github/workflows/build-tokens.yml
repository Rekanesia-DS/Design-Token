name: Main to GCS Deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run build script
      - name: Run build
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      # Upload build artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifacts
          path: build/  # Folder hasil build

  deploy:
    name: Push Artifacts and Deploy to GCS
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: my-artifacts
          path: ./build  # Mengunduh ke direktori saat ini

      # Pull latest changes from master
      - name: Pull Latest Master
        run: git pull

      # Commit and push artifacts to master
      - name: Commit and Push Changes
        env:
          PAT: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all files to staging area
          git add --all || { echo "Failed adding files to staging area."; exit 1; }
        
          # Check if there are any changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            # Commit changes
            git commit -m "Add build artifacts from workflow (SHA: ${{ github.sha }})" || { echo "Failed committing changes."; exit 1; }
            
            # Set up remote URL with token authentication
            git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
        
            # Push changes
            git push -f origin HEAD:master || { echo "Failed pushing changes."; exit 1; }
          fi

      # Setup Google Cloud CLI
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2  # Versi terbaru
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: durable-fact-310601
          export_default_credentials: true

      - name: Verify GCP Authentication  # Langkah verifikasi baru
        run: |
          gcloud auth list
          gsutil ls gs://cdn-test-rekan

      # Upload build artifacts to GCS  
      - name: Upload to GCS
        run: |
          echo "Cleaning bucket..."
          gsutil -m rm -r gs://cdn-test-rekan/ui-rekan-ipubers/** || true
          
          echo "Uploading files..."
          gsutil -m cp -Z -r "$(pwd)/build/" gs://cdn-test-rekan/ui-rekan-ipubers/
