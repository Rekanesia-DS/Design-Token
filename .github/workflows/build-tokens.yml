name: Build Tokens

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.6.1
        uses: actions/setup-node@v3
        with:
          node-version: '20.6.1'

      - name: Cache npm dependencies (optional)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run build (with error handling and logging)
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifacts
          path: |
            build

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/my-artifacts.zip
