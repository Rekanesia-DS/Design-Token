name: Build Tokens

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.6.1
        uses: actions/setup-node@v3
        with:
          node-version: '20.6.1'

      - name: Cache npm dependencies (optional)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Run build (with error handling and logging)
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4  # No need to zip
        with:
          name: my-artifacts  # Customize artifact name as needed
          path: build/  # Assuming build output goes to 'build' folder

      - name: Create branch master (if it doesn't exist)
        run: |
          git checkout -b master  # Create branch master if it doesn't exist
          echo "Created branch master (if it doesn't exist)."

      - name: Commit and Push changes (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"  # Replace with your name if desired
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/ || echo "Failed adding build directory to staging area."
          git commit -m "Pushed build artifacts from workflow (SHA: ${{ github.sha }})" || echo "Failed committing changes."
          git push origin master

