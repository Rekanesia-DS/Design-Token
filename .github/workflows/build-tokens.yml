name: Build Tokens

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.6.1
        uses: actions/setup-node@v3
        with:
          node-version: '20.6.1'

      - name: Cache npm dependencies (optional)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Run build (with error handling and logging)
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4  # No need to zip
        with:
          name: my-artifacts  # Customize artifact name as needed
          path: build/  # Assuming build output goes to 'build' folder

      - name: Create branch master (if it doesnt exist)
        run: |
          git checkout -b build  # Create branch master if it doesn't exist
          echo "Created branch master (if it doesn't exist)."

      - name: Commit and Push changes (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"  # Replace with your name if desired
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Config complete..."
        
          # Add build directory to staging area
          git add build/ || { echo "Failed adding build directory to staging area."; exit 1; }
          echo "Add build/ success.."
        
          # Check if there are any changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            # Commit changes
            git commit -m "Pushed build artifacts from workflow (SHA: ${{ github.sha }})" || { echo "Failed committing changes."; exit 1; }
            echo "Commit success.."
            
            # Set up remote URL with token authentication
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        
            # Push changes
            git push origin master || { echo "Failed pushing changes."; exit 1; }
            echo "Push success.."
          fi
