name: Main to GCS Deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy to GCS
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Node.js environment
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            - ${{ runner.os }}-node-
            - ${{ runner.os }}-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run build script
      - name: Run build
        run: |
          node build-tokens.mjs || echo "Build failed! See error messages above."
          echo "Build completed (if no errors)."

      # Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      # Upload build artifacts to GCS
      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: build/
          destination: gs://cdn-test-rekan/ui-rekan-ipubers/
